# 계좌/전략 설정. 실제 값(API 키 등)은 여기 넣지 않고, 서버의 .env 파일에 저장한 뒤
# 아래에는 "환경변수 이름"만 적는다 (이 파일은 git에 커밋해도 안전, .env는 git에 올리지 않음).
#
# 사용법:
#   1) 이 파일을 accounts.yaml 로 복사
#   2) .env.example 을 .env 로 복사하고 실제 키 값 채우기
#   3) mode: demo 로 충분히 검증 후에만 production으로 전환
#   4) enabled: false 인 동안은 주문 계산만 하고 실제 주문 전송은 하지 않음(dry-run)
#      enabled: true 로 바꿔야 실제로 DB증권에 주문이 나간다.

accounts:
  - id: jh_main                     # 내부 식별자 (로그/파일명에 쓰임, 영문/숫자만)
    label: "서정호 본인계좌"          # 화면에 표시할 이름
    broker: dbsec
    strategy: soxl_dual_sniper       # 적용할 전략 (지금은 이거 하나, 나중에 다른 전략 추가 가능)
    symbol: SOXL
    market: FN                       # FY:뉴욕 FN:나스닥 FA:아멕스 (SOXL은 나스닥=FN)
    mode: demo                       # demo(모의투자) | production(실전) — 반드시 demo로 먼저 검증
    enabled: false                   # true가 되기 전까지는 실주문 전송 안 함 (계산/로그만)
    account_no_env: DBSEC_JH_ACCOUNT_NO
    app_key_env: DBSEC_JH_DEMO_APP_KEY
    app_secret_env: DBSEC_JH_DEMO_APP_SECRET

  # 계좌/전략 추가 예시 (나중에 배우자/법인 계좌 등을 이렇게 아래에 추가하면 됨):
